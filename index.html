<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#9e285d">
  <meta name="description" content="Ladli Beauty shop management app">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Ladli Beauty</title>
  <style>
    :root{color-scheme:light;--pink:#9e285d;--bg:#fff8fb;--ink:#281923}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
    body{display:flex;flex-direction:column;overflow:hidden}
    header{height:54px;flex:none;background:var(--pink);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;padding-top:env(safe-area-inset-top);font-weight:700}
    header img{width:30px;height:30px;border-radius:8px}
    header span{flex:1}
    header button{border:1px solid #ffffff80;background:transparent;color:white;border-radius:8px;padding:7px 10px}
    #app{border:0;width:100%;flex:1;min-height:0;background:white}
    #setup{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
    .panel{max-width:440px;width:100%;background:#fff;border:1px solid #ead9e1;border-radius:18px;padding:22px;box-shadow:0 12px 36px #6b21401a}
    .panel h1{font-size:22px;margin:0 0 8px}.panel p{color:#65535d;line-height:1.5}
    input{width:100%;padding:13px;border:1px solid #d9c7d0;border-radius:10px;font:inherit}
    .primary{width:100%;padding:13px;margin-top:12px;border:0;border-radius:10px;background:var(--pink);color:#fff;font-weight:700;font:inherit}
    small{color:#76636d;display:block;margin-top:10px;line-height:1.4}
    @media(min-width:900px){#app{max-width:900px;margin:auto;width:100%}}
  </style>
</head>
<body>
  <header><img src="./icons/icon-192.png" alt=""><span>Ladli Beauty</span><button id="change">Change URL</button></header>
  <iframe id="app" title="Ladli Beauty shop app" allow="clipboard-read; clipboard-write"></iframe>
  <section id="setup">
    <div class="panel">
      <h1>Connect Ladli Beauty</h1>
      <p>Paste your deployed Google Apps Script Web App URL. It usually ends in <b>/exec</b>.</p>
      <input id="url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="url">
      <button class="primary" id="save">Open Ladli Beauty</button>
      <small>This address is saved only on this device. The PWA shell does not store your shop PIN or business records.</small>
    </div>
  </section>
  <script>
    const frame=document.getElementById('app'),setup=document.getElementById('setup'),urlInput=document.getElementById('url');
    function valid(u){try{const x=new URL(u);return x.protocol==='https:'&&/^(script\.google\.com|script\.googleusercontent\.com)$/.test(x.hostname)}catch(e){return false}}
    function openApp(u){if(!valid(u)){setup.style.display='flex';urlInput.focus();return}
      localStorage.setItem('ladliAppsScriptUrl',u);setup.style.display='none';frame.src=u}
    const DEFAULT_URL="https://script.google.com/macros/s/AKfycbw0ZtmPafzlH8cpB8H2plDklMJDIvdPO6KQ0x2utmdX-3Dc5yBiF6TBUfPEZt7TrP8X/exec";
    const saved=localStorage.getItem('ladliAppsScriptUrl')||DEFAULT_URL; if(saved)openApp(saved);else setup.style.display='flex';
    document.getElementById('save').onclick=()=>openApp(urlInput.value.trim());
    document.getElementById('change').onclick=()=>{urlInput.value=localStorage.getItem('ladliAppsScriptUrl')||'';setup.style.display='flex'};
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error))}
    let installPrompt=null;
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
  </script>
</body>
</html>
